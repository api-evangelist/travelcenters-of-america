naftiko: "1.0.0-alpha1"

info:
  label: "TravelCenters of America API"
  description: "REST APIs for TA and Petro travel center operations including truck service, retail locations, fuel codes, pricing, parking, and shower availability."
  tags:
    - Travel Centers
    - Truck Service
    - Retail
    - Fuel
    - Locations
    - Trucking
    - Fleet Management
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      TA_API_TOKEN: TA_API_TOKEN

capability:
  consumes:
    - type: http
      namespace: ta
      baseUri: https://api.accessta.com/v1
      description: "TravelCenters of America REST APIs for truck service and retail operations."
      authentication:
        type: bearer
        token: "{{TA_API_TOKEN}}"
      resources:
        - name: locations
          path: /locations
          description: "Travel center location search"
          operations:
            - name: list-locations
              method: GET
              description: "List TA/Petro travel center locations with amenity details"
              inputParameters:
                - name: lat
                  in: query
                  type: number
                  required: false
                  description: "Latitude for proximity search"
                - name: lon
                  in: query
                  type: number
                  required: false
                  description: "Longitude for proximity search"
                - name: radius
                  in: query
                  type: number
                  required: false
                  description: "Search radius in miles"
                - name: brand
                  in: query
                  type: string
                  required: false
                  description: "TA, Petro, or TA Express"
                - name: state
                  in: query
                  type: string
                  required: false
                  description: "US state code"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: parking
          path: /parking/availability
          description: "Truck parking availability"
          operations:
            - name: get-parking-availability
              method: GET
              description: "Get real-time truck parking availability at travel centers"
              inputParameters:
                - name: location_id
                  in: query
                  type: string
                  required: false
                  description: "Filter by location ID"
                - name: lat
                  in: query
                  type: number
                  required: false
                  description: "Latitude for proximity search"
                - name: lon
                  in: query
                  type: number
                  required: false
                  description: "Longitude for proximity search"
                - name: radius
                  in: query
                  type: number
                  required: false
                  description: "Search radius in miles"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: showers
          path: /showers/availability
          description: "Shower facility availability"
          operations:
            - name: get-shower-availability
              method: GET
              description: "Get shower availability at travel centers"
              inputParameters:
                - name: location_id
                  in: query
                  type: string
                  required: false
                  description: "Filter by location ID"
                - name: lat
                  in: query
                  type: number
                  required: false
                  description: "Latitude for proximity search"
                - name: lon
                  in: query
                  type: number
                  required: false
                  description: "Longitude for proximity search"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: work-orders
          path: /truck-service/work-orders
          description: "Truck service work order management"
          operations:
            - name: list-work-orders
              method: GET
              description: "List truck service work orders"
              inputParameters:
                - name: status
                  in: query
                  type: string
                  required: false
                  description: "Filter by status"
                - name: location_id
                  in: query
                  type: string
                  required: false
                  description: "Filter by service location"
                - name: start_date
                  in: query
                  type: string
                  required: false
                  description: "Filter from date"
                - name: end_date
                  in: query
                  type: string
                  required: false
                  description: "Filter to date"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: documents
          path: /truck-service/documents
          description: "Truck service documentation search"
          operations:
            - name: search-documents
              method: GET
              description: "Search truck service documents including invoices and service records"
              inputParameters:
                - name: work_order_id
                  in: query
                  type: string
                  required: false
                  description: "Filter by work order ID"
                - name: vehicle_id
                  in: query
                  type: string
                  required: false
                  description: "Filter by vehicle ID"
                - name: document_type
                  in: query
                  type: string
                  required: false
                  description: "Filter by document type"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: fuel-codes
          path: /fuel-codes
          description: "Fleet fuel code management"
          operations:
            - name: list-fuel-codes
              method: GET
              description: "List fuel codes for the fleet account"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: pricing
          path: /pricing
          description: "Fuel and service pricing"
          operations:
            - name: get-pricing
              method: GET
              description: "Get current fuel pricing at travel center locations"
              inputParameters:
                - name: location_id
                  in: query
                  type: string
                  required: false
                  description: "Filter by location"
                - name: fuel_type
                  in: query
                  type: string
                  required: false
                  description: "Filter by fuel type"
                - name: lat
                  in: query
                  type: number
                  required: false
                  description: "Latitude for proximity search"
                - name: lon
                  in: query
                  type: number
                  required: false
                  description: "Longitude for proximity search"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: ta-rest
      resources:
        - path: /v1/locations
          name: locations
          operations:
            - method: GET
              name: list-locations
              description: "List travel center locations"
              call: "ta.list-locations"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/parking
          name: parking
          operations:
            - method: GET
              name: get-parking-availability
              description: "Get parking availability"
              call: "ta.get-parking-availability"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/work-orders
          name: work-orders
          operations:
            - method: GET
              name: list-work-orders
              description: "List truck service work orders"
              call: "ta.list-work-orders"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: ta-mcp
      transport: http
      tools:
        - name: list-locations
          description: "Find TA and Petro travel center locations"
          hints:
            readOnly: true
            openWorld: true
          call: "ta.list-locations"
          with:
            lat: "tools.lat"
            lon: "tools.lon"
            radius: "tools.radius"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-parking-availability
          description: "Check truck parking availability at travel centers"
          hints:
            readOnly: true
            openWorld: true
          call: "ta.get-parking-availability"
          with:
            lat: "tools.lat"
            lon: "tools.lon"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-pricing
          description: "Get current fuel pricing at travel centers"
          hints:
            readOnly: true
            openWorld: true
          call: "ta.get-pricing"
          with:
            lat: "tools.lat"
            lon: "tools.lon"
            fuel_type: "tools.fuel_type"
          outputParameters:
            - type: object
              mapping: "$."
