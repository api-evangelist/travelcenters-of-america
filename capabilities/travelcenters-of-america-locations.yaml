naftiko: 1.0.0-alpha2
info:
  label: TravelCenters of America API — Locations
  description: 'TravelCenters of America API — Locations. 3 operations. Lead operation: List Locations. Self-contained Naftiko
    capability covering one Travelcenters Of America business surface.'
  tags:
  - Travelcenters Of America
  - Locations
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TRAVELCENTERS_OF_AMERICA_API_KEY: TRAVELCENTERS_OF_AMERICA_API_KEY
capability:
  consumes:
  - type: http
    namespace: travelcenters-of-america-locations
    baseUri: https://api.accessta.com/v1
    description: TravelCenters of America API — Locations business capability. Self-contained, no shared references.
    resources:
    - name: locations
      path: /locations
      operations:
      - name: listlocations
        method: GET
        description: List Locations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: lat
          in: query
          type: number
          description: Latitude for proximity search
        - name: lon
          in: query
          type: number
          description: Longitude for proximity search
        - name: radius
          in: query
          type: number
          description: Search radius in miles
        - name: brand
          in: query
          type: string
          description: Filter by travel center brand
        - name: state
          in: query
          type: string
          description: Filter by US state code (e.g., OH, TX)
        - name: limit
          in: query
          type: integer
          description: Maximum locations to return
    - name: locations-id
      path: /locations/{id}
      operations:
      - name: getlocation
        method: GET
        description: Get Location
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: Location identifier
          required: true
    - name: locations-id-amenities
      path: /locations/{id}/amenities
      operations:
      - name: getlocationamenities
        method: GET
        description: Get Location Amenities
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: Location identifier
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.TRAVELCENTERS_OF_AMERICA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: travelcenters-of-america-locations-rest
    port: 8080
    description: REST adapter for TravelCenters of America API — Locations. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/locations
      name: locations
      description: REST surface for locations.
      operations:
      - method: GET
        name: listlocations
        description: List Locations
        call: travelcenters-of-america-locations.listlocations
        with:
          lat: rest.lat
          lon: rest.lon
          radius: rest.radius
          brand: rest.brand
          state: rest.state
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/locations/{id}
      name: locations-id
      description: REST surface for locations-id.
      operations:
      - method: GET
        name: getlocation
        description: Get Location
        call: travelcenters-of-america-locations.getlocation
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/locations/{id}/amenities
      name: locations-id-amenities
      description: REST surface for locations-id-amenities.
      operations:
      - method: GET
        name: getlocationamenities
        description: Get Location Amenities
        call: travelcenters-of-america-locations.getlocationamenities
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: travelcenters-of-america-locations-mcp
    port: 9090
    transport: http
    description: MCP adapter for TravelCenters of America API — Locations. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-locations
      description: List Locations
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: travelcenters-of-america-locations.listlocations
      with:
        lat: tools.lat
        lon: tools.lon
        radius: tools.radius
        brand: tools.brand
        state: tools.state
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: get-location
      description: Get Location
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: travelcenters-of-america-locations.getlocation
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: get-location-amenities
      description: Get Location Amenities
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: travelcenters-of-america-locations.getlocationamenities
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
