naftiko: 1.0.0-alpha2
info:
  label: TravelCenters of America API — Fuel Codes
  description: 'TravelCenters of America API — Fuel Codes. 1 operations. Lead operation: List Fuel Codes. Self-contained Naftiko
    capability covering one Travelcenters Of America business surface.'
  tags:
  - Travelcenters Of America
  - Fuel Codes
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TRAVELCENTERS_OF_AMERICA_API_KEY: TRAVELCENTERS_OF_AMERICA_API_KEY
capability:
  consumes:
  - type: http
    namespace: travelcenters-of-america-fuel-codes
    baseUri: https://api.accessta.com/v1
    description: TravelCenters of America API — Fuel Codes business capability. Self-contained, no shared references.
    resources:
    - name: fuel-codes
      path: /fuel-codes
      operations:
      - name: listfuelcodes
        method: GET
        description: List Fuel Codes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.TRAVELCENTERS_OF_AMERICA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: travelcenters-of-america-fuel-codes-rest
    port: 8080
    description: REST adapter for TravelCenters of America API — Fuel Codes. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/fuel-codes
      name: fuel-codes
      description: REST surface for fuel-codes.
      operations:
      - method: GET
        name: listfuelcodes
        description: List Fuel Codes
        call: travelcenters-of-america-fuel-codes.listfuelcodes
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: travelcenters-of-america-fuel-codes-mcp
    port: 9090
    transport: http
    description: MCP adapter for TravelCenters of America API — Fuel Codes. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-fuel-codes
      description: List Fuel Codes
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: travelcenters-of-america-fuel-codes.listfuelcodes
      outputParameters:
      - type: object
        mapping: $.
