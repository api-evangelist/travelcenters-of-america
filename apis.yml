aid: travelcenters-of-america
name: TravelCenters of America
description: >-
  TravelCenters of America is the largest publicly traded full-service travel center network in the United States,
  operating under the TA, Petro Stopping Centers, and TA Express brands. The company provides REST APIs for truck
  service work order management, retail location data, fuel codes, pricing, parking availability, and shower
  availability.
